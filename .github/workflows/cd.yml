name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Test
        run: |
          npm run lint
          npm run test:cov

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
            ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Desplegar en staging (puerto 8080)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}
            docker stop mi-app-staging || true
            docker rm mi-app-staging || true
            docker run -d --name mi-app-staging --restart unless-stopped -p 8080:3000 ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar en produccion con Health Check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}"
            docker pull $IMAGE
            docker rm -f mi-app-new || true
            docker run -d --name mi-app-new --restart unless-stopped -p 3001:3000 $IMAGE
            sleep 5
            if curl -sf http://localhost:3001/health; then
              echo "Health check exitoso. Activando contenedor en puerto 80..."
              docker stop mi-app || true
              docker rm mi-app || true
              docker run -d --name mi-app --restart unless-stopped -p 80:3000 $IMAGE
              docker rm -f mi-app-new || true
            else
              echo "Health check FALLIDO. Cancelando despliegue."
              docker rm -f mi-app-new || true
              exit 1
            fi
            docker system prune -f
